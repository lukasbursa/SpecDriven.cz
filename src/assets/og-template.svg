<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    Šablona obrázku pro sdílení. Pravidla jsou v CLAUDE.md, sekce „Obrázky pro sdílení“.
    Zkopíruj ji jako src/content/<articles|tools>/<slug>.og.svg, pevné prvky neměň,
    uprav štítek a název a do vyznačené oblasti nakresli motiv. Skupina „vodítka“
    se nevykresluje, oblasti ukazuje jen pro orientaci a smí zůstat v souboru.
  -->
  <defs>
    <pattern id="mrizka" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f5fbf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Pevné: pozadí „papír“ s mřížkou. -->
  <rect width="1200" height="630" fill="#fafaf7"/>
  <rect width="1200" height="630" fill="url(#mrizka)"/>

  <!-- Pevné: logo a nápis. -->
  <g transform="translate(80 80) scale(1.6667)" fill="none" stroke="#1f5fbf">
    <rect x="2.5" y="2.5" width="19" height="19" rx="3" stroke-width="2"/>
    <path d="M7 12.5l3.2 3.2L17 8.8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="136" y="113" font-family="IBM Plex Mono" font-weight="600" font-size="34" fill="#14202e">SpecDriven.cz</text>

  <!-- Pevné: modrý pruh dole. -->
  <rect y="618" width="1200" height="12" fill="#1f5fbf"/>

  <!-- Štítek: Mono 400, 28 px, #46525f, cesta jako na stránce. -->
  <text x="80" y="208" font-family="IBM Plex Mono" font-size="28" fill="#46525f">clanky / slug-stranky</text>

  <!-- Název: Sans 600, 64 px (nejméně 52), nejvýš 3 řádky po 76 px, zalomení ručně. -->
  <text font-family="IBM Plex Sans" font-weight="600" font-size="64" fill="#14202e">
    <tspan x="80" y="292">Název stránky</tspan>
    <tspan x="80" y="368">na dva řádky</tspan>
  </text>

  <!-- Vodítka: okraje a oblasti pro název a motiv. Nevykreslují se. -->
  <g id="vodítka" display="none" fill="none" stroke="#a3202a" stroke-dasharray="8 6" stroke-width="2">
    <!-- Bezpečná oblast: okraj 80 px vlevo a vpravo, nad pruhem 28 px. -->
    <rect x="80" y="60" width="1040" height="530"/>
    <!-- Název přes celou šířku (motiv pak pod ním, y 420–590), nebo jen vlevo do x 700 (motiv vpravo). -->
    <rect x="80" y="236" width="1040" height="222"/>
    <!-- Motiv pod názvem na dva řádky. -->
    <rect x="80" y="420" width="1040" height="170"/>
    <!-- Motiv vpravo vedle užšího názvu. -->
    <rect x="740" y="160" width="380" height="430"/>
  </g>
</svg>
