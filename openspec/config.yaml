schema: spec-driven

context: |
  Language: cs
  All artifacts must be written in cs.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: SpecDriven.cz – český rozcestník o spec-driven developmentu (SDD).
  Cílové publikum: čeští vývojáři, tech leadi a týmy, kteří chtějí při práci
  s AI asistenty stavět software podle specifikací.

  Web je univerzální – není o jednom nástroji.

  Tón obsahu: věcný a informativní. Vysvětlujeme, co nástroj nebo pojem je
  a jak funguje. Fakta o nástrojích odkazují na oficiální zdroje a nesou datum
  ověření, protože se rychle mění.

  Výjimkou jsou názorové články. Mají štítek `názor` a smí mít ostřejší
  formulace v nadpisu, perexu a závěru. Fakta v nich odkazují na zdroj
  stejně jako jinde.

  Web sám je vyvíjen veřejně přes OpenSpec – repozitář slouží jako živá ukázka
  metody. Proto mají být proposals, specs i tasks srozumitelné i pro čtenáře
  zvenku, kteří se z nich učí. OpenSpec je zmíněn jako nástroj, kterým web
  vznikl, ne jako doporučení.

  Vizuální styl: „web jako specifikace“ – střední cesta. Struktura připomíná
  specifikaci (prefixy ##, scénáře WHEN/THEN, delty +/−, frontmatter, stavový
  řádek), ale text článků je klidný a čitelný. Písmo IBM Plex Sans + Mono,
  modrý akcent, světlý režim „papír“, tmavý režim „blueprint“.

  Stack: Astro 7 (statický výstup), obsah v Markdown/MDX přes content
  collections, TypeScript, čisté moderní CSS (bez frameworku).
  Hosting: webhosting s Apache (konfigurace
  v .htaccess), nasazení přes FTP z GitHub Actions po každém pushi do main.

  Konvence:
  - Obsah webu je česky, s diakritikou.
  - Rychlost a přístupnost (WCAG AA) mají přednost před efekty.
  - Každá změna webu prochází cyklem propose → apply → archive.

rules:
  tasks:
    - >-
      Když změna přidává článek nebo nástroj nebo mění jeho název, úkoly MUST
      obsahovat nakreslení nebo úpravu obrázku pro sdílení (`<slug>.og.svg`)
      podle sekce „Obrázky pro sdílení“ v CLAUDE.md a kontrolu vykresleného PNG.
